    // Simple Web Audio Sound Synthesizer for Cyber feedback
    const playCyberAudio = (type) => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        const now = ctx.currentTime;
        if (type === 'send') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(580, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
          gain.gain.setValueAtTime(0.04, now);
          gain.gain.linearRampToValueAtTime(0.001, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === 'react') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(740, now);
          gain.gain.setValueAtTime(0.03, now);
          gain.gain.linearRampToValueAtTime(0.001, now + 0.05);
          osc.start(now);
          osc.stop(now + 0.05);
        } else if (type === 'alert') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.linearRampToValueAtTime(220, now + 0.2);
          gain.gain.setValueAtTime(0.05, now);
          gain.gain.linearRampToValueAtTime(0.001, now + 0.2);
          osc.start(now);
          osc.stop(now + 0.2);
        } else if (type === 'grant') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.08);
          osc.frequency.setValueAtTime(783.99, now + 0.16);
          gain.gain.setValueAtTime(0.05, now);
          gain.gain.linearRampToValueAtTime(0.001, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        }
      } catch (e) {}
    };

    function ReplicaApp() {
      // User Identity & Gatekeeper State
      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem('replica_user');
        return saved ? JSON.parse(saved) : null;
      });

      // Form inputs for Gatekeeper (NO secret code!)
      const [inputActualName, setInputActualName] = useState('');
      const [inputUsername, setInputUsername] = useState('');
      const [inputNote, setInputNote] = useState('');
      const [gatekeeperStatus, setGatekeeperStatus] = useState('idle');
      const [pendingRequestId, setPendingRequestId] = useState(null);
      const [bannedReason, setBannedReason] = useState(null);

      // Master Admin Password Input (Direct Password prompt, NO Gmail input!)
      const [adminInputPassword, setAdminInputPassword] = useState('');
      const [isAdminLoginModal, setIsAdminLoginModal] = useState(false);
      const [adminAuthError, setAdminAuthError] = useState('');

      // Channels & Direct Messages (DMs)
      const [activeChatTarget, setActiveChatTarget] = useState({ type: 'channel', id: '#main-board' }); // { type: 'channel'|'dm', id: '#main-board'|'JARVIS'|'username' }
      const [channels] = useState([
        { id: '#main-board', name: 'main-board', desc: 'Universal Cyberboard' },
        { id: '#hack-ops', name: 'hack-ops', desc: 'Tactical Drills & JARVIS' },
        { id: '#lounge', name: 'lounge', desc: 'Friends Lounge' }
      ]);

      // Cyberboard Main Chat State
      const [message, setMessage] = useState('');
      const [replyingTo, setReplyingTo] = useState(null);
      const [attachedFile, setAttachedFile] = useState(null);
      const [isScanningFile, setIsScanningFile] = useState(false);
      const [posts, setPosts] = useState([]);
      const [activeUsersCount, setActiveUsersCount] = useState(1);
      const [showSlashHints, setShowSlashHints] = useState(false);
      const [hoveredPostId, setHoveredPostId] = useState(null);
      const [activeEmojiPickerPostId, setActiveEmojiPickerPostId] = useState(null);

      // Moderation / Banned Users & Approvals (Admin view)
      const [accessRequests, setAccessRequests] = useState([]);
      const [bannedUsersList, setBannedUsersList] = useState([]);
      const [isRequestsModalOpen, setIsRequestsModalOpen] = useState(false);
      const [adminModalTab, setAdminModalTab] = useState('approvals'); // 'approvals' | 'banned'
      const [copiedLink, setCopiedLink] = useState(false);

      // JARVIS & Security State
      const [isTerminalOpen, setIsTerminalOpen] = useState(false);
      const [terminalInput, setTerminalInput] = useState('');
      const [securityState, setSecurityState] = useState({
        threatsNeutralized: 18,
        firewallIntegrity: 100,
        defenseMode: 'MAXIMUM',
        systemAuditLogs: [
          `[SYS] JARVIS AI Sentinel initialized.`,
          `[GATE] Gatekeeper locked. Master Admin: ${MASTER_ADMIN_EMAIL}.`
        ]
      });

      // Voice Call State with Microphone Activity Tracking
      const [isVoiceActive, setIsVoiceActive] = useState(false);
      const [isMicMuted, setIsMicMuted] = useState(false);
      const [isSpeakingLocal, setIsSpeakingLocal] = useState(false);
      const [voiceParticipants, setVoiceParticipants] = useState([]);
      const [callDuration, setCallDuration] = useState(0);

      // Lightbox preview for image payloads
      const [lightboxImg, setLightboxImg] = useState(null);

      // Refs
      const socketRef = useRef(null);
      const chatEndRef = useRef(null);
      const terminalEndRef = useRef(null);
      const fileInputRef = useRef(null);
      const callTimerRef = useRef(null);
      const messageInputRef = useRef(null);

      // Save user session
      useEffect(() => {
        if (currentUser) {
          localStorage.setItem('replica_user', JSON.stringify(currentUser));
        } else {
          localStorage.removeItem('replica_user');
        }
      }, [currentUser]);

      // Connect to Socket.IO
      useEffect(() => {
        try {
          if (typeof io !== 'undefined') {
            const socket = io();
            socketRef.current = socket;

            socket.on('initHistory', (history) => {
              if (Array.isArray(history)) setPosts(history);
            });

            socket.on('newPost', (post) => {
              setPosts((prev) => {
                if (prev.some((p) => p.id === post.id)) return prev;
                return [...prev, post];
              });
              playCyberAudio('send');
            });

            socket.on('postReactionUpdate', ({ postId, reactions }) => {
              setPosts((prev) => prev.map((p) => p.id === postId ? { ...p, reactions } : p));
              playCyberAudio('react');
            });

            socket.on('userCountUpdate', (count) => {
              setActiveUsersCount(count);
            });

            socket.on('allAccessRequests', (requests) => {
              if (Array.isArray(requests)) setAccessRequests(requests);
            });

            socket.on('bannedUsersList', (banned) => {
              if (Array.isArray(banned)) setBannedUsersList(banned);
            });

            socket.on('newAccessRequestNotification', () => {
              playCyberAudio('alert');
            });

            socket.on('adminPasswordResult', ({ success, adminUser, message }) => {
              if (success && adminUser) {
                setCurrentUser(adminUser);
                setIsAdminLoginModal(false);
                setAdminAuthError('');
                playCyberAudio('grant');
              } else {
                setAdminAuthError(message || 'Incorrect master password');
                playCyberAudio('alert');
              }
            });

            socket.on('accessDecision', (decision) => {
              if (decision.requestId === pendingRequestId || (currentUser && currentUser.username === decision.username)) {
                if (decision.status === 'approved') {
                  playCyberAudio('grant');
                  setGatekeeperStatus('approved');
                  const approvedUserObj = {
                    actualName: decision.actualName,
                    username: decision.username,
                    isApproved: true,
                    isAdmin: decision.username === 'Master Admin'
                  };
                  setCurrentUser(approvedUserObj);
                } else if (decision.status === 'denied') {
                  playCyberAudio('alert');
                  setGatekeeperStatus('denied');
                }
              }
            });

            // Instant Ban Event Ejection
            socket.on('userBannedEvent', ({ username, reason }) => {
              if (currentUser && currentUser.username.toLowerCase() === username.toLowerCase()) {
                setBannedReason(reason);
                setCurrentUser(null);
                setGatekeeperStatus('banned');
                playCyberAudio('alert');
              }
            });

            socket.on('accessDeniedBanned', ({ reason }) => {
              setBannedReason(reason);
              setGatekeeperStatus('banned');
            });

            socket.on('userRevoked', ({ username }) => {
              if (currentUser && currentUser.username.toLowerCase() === username.toLowerCase()) {
                alert('Your access has been revoked by the Master Admin.');
                setCurrentUser(null);
                setGatekeeperStatus('idle');
              }
            });

            socket.on('voiceStateUpdate', (participants) => {
              setVoiceParticipants(participants || []);
            });

            socket.on('securityState', (sec) => {
              if (sec) setSecurityState(prev => ({ ...prev, ...sec }));
            });

            socket.on('securityAuditLog', (logEntry) => {
              setSecurityState(prev => ({
                ...prev,
                systemAuditLogs: [...prev.systemAuditLogs.slice(-60), logEntry]
              }));
            });

            return () => socket.disconnect();
          }
        } catch (err) {
          console.warn('Socket connect failed:', err);
        }
      }, [pendingRequestId, currentUser]);

      // Scroll chat to bottom
      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [posts, activeChatTarget]);

      // Scroll terminal logs
      useEffect(() => {
        if (isTerminalOpen) {
          terminalEndRef.current?.scrollIntoView({ behavior: 'smooth' });
        }
      }, [securityState.systemAuditLogs, isTerminalOpen]);

      // Call timer
      useEffect(() => {
        if (isVoiceActive) {
          callTimerRef.current = setInterval(() => {
            setCallDuration(d => d + 1);
          }, 1000);
        } else {
          clearInterval(callTimerRef.current);
          setCallDuration(0);
        }
        return () => clearInterval(callTimerRef.current);
      }, [isVoiceActive]);

      // Tripcode Generator
      const getTripcode = (name) => {
        if (!name) return '!rEp3x99a';
        let hash = 0;
        for (let i = 0; i < name.length; i++) {
          hash = (hash << 5) - hash + name.charCodeAt(i);
          hash |= 0;
        }
        return '!' + Math.abs(hash).toString(36).substring(0, 8);
      };

      // Submit Access Request (NO secret code!)
      const handleRequestAccessSubmit = (e) => {
        e.preventDefault();
        if (!inputActualName.trim() || !inputUsername.trim()) return;

        setGatekeeperStatus('submitting');

        const payload = {
          actualName: inputActualName.trim(),
          username: inputUsername.trim(),
          note: inputNote.trim()
        };

        if (socketRef.current) {
          socketRef.current.emit('submitAccessRequest', payload);
          setGatekeeperStatus('pending');
        } else {
          fetch('/api/request-access', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          })
          .then(res => res.json())
          .then(data => {
            setPendingRequestId(data.requestId);
            setGatekeeperStatus('pending');
          })
          .catch(() => setGatekeeperStatus('idle'));
        }
      };

      // Master Admin Password Verification (Checks password directly, DOES NOT ask for Gmail!)
      const handleAdminPasswordSubmit = (e) => {
        e.preventDefault();
        setAdminAuthError('');
        if (!adminInputPassword.trim()) {
          setAdminAuthError('Please enter the password.');
          return;
        }

        if (socketRef.current) {
          socketRef.current.emit('verifyAdminPassword', { password: adminInputPassword.trim() });
        } else {
          // Direct fallback
          if (adminInputPassword.length >= 4) {
            const adminUser = {
              actualName: 'Administrator',
              username: 'Master Admin',
              email: MASTER_ADMIN_EMAIL,
              isApproved: true,
              isAdmin: true
            };
            setCurrentUser(adminUser);
            setIsAdminLoginModal(false);
          } else {
            setAdminAuthError('Invalid password. Minimum 4 characters.');
          }
        }
      };

      // Admin Ban User
      const handleBanUser = (targetUsername) => {
        if (!currentUser?.isAdmin || !targetUsername) return;
        const reason = prompt(`Enter reason to permanently BAN @${targetUsername}:`, 'Violation of server protocols') || 'Banned by Master Admin';
        if (socketRef.current) {
          socketRef.current.emit('banUser', { username: targetUsername, reason });
          playCyberAudio('alert');
        }
      };

      // Admin Unban User
      const handleUnbanUser = (targetUsername) => {
        if (!currentUser?.isAdmin || !targetUsername) return;
        if (socketRef.current) {
          socketRef.current.emit('unbanUser', { username: targetUsername });
          playCyberAudio('grant');
        }
      };

      // Admin Resolves Access Request (Approve / Deny)
      const handleResolveRequest = (requestId, action) => {
        if (!currentUser?.isAdmin) return;
        if (socketRef.current) {
          socketRef.current.emit('resolveAccessRequest', {
            requestId,
            action,
            adminKey: MASTER_ADMIN_EMAIL
          });
          playCyberAudio(action === 'approve' ? 'grant' : 'alert');
        }
      };

      // Toggle Emoji Reaction on a post (Real-Time via Socket Event)
      const handleToggleReaction = (postId, emoji) => {
        if (!currentUser) return;
        if (socketRef.current) {
          socketRef.current.emit('toggleReaction', {
            postId,
            emoji,
            username: currentUser.username
          });
        }
        setActiveEmojiPickerPostId(null);
      };

      // Copy Website Link for friends
      const handleCopyInviteLink = () => {
        const fullLink = `${window.location.origin}${window.location.pathname}`;
        navigator.clipboard.writeText(fullLink);
        setCopiedLink(true);
        setTimeout(() => setCopiedLink(false), 2500);
      };

      // File Attachment Handler with JARVIS Simulated Anti-Malware Scan
      const handleFileSelect = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setIsScanningFile(true);

        const reader = new FileReader();
        reader.onload = (ev) => {
          setTimeout(() => {
            setIsScanningFile(false);
            setAttachedFile({
              name: file.name,
              size: (file.size / 1024).toFixed(1) + ' KB',
              type: file.type || 'application/octet-stream',
              dataUrl: ev.target.result,
              isImage: file.type.startsWith('image/'),
              isAudio: file.type.startsWith('audio/')
            });
            playCyberAudio('grant');
          }, 1000);
        };
        reader.readAsDataURL(file);
      };

      // Send Chat Post (Supports Channels and DMs)
      const handlePostSubmit = (e) => {
        if (e) e.preventDefault();
        if (!message.trim() && !attachedFile) return;

        const currentMsg = message.trim();
        const author = currentUser?.username || 'Anonymous';
        const actualName = currentUser?.actualName || 'Friend';
        const trip = getTripcode(author);

        const isDm = activeChatTarget.type === 'dm';
        const channelId = isDm ? null : activeChatTarget.id;
        const recipient = isDm ? activeChatTarget.id : null;

        const postData = {
          channelId,
          recipient,
          author,
          actualName,
          trip,
          content: currentMsg,
          file: attachedFile,
          replyTo: replyingTo

        if (socketRef.current && socketRef.current.connected) {
          socketRef.current.emit('sendPost', postData);

          const localPost = {
            id: Math.floor(100000 + Math.random() * 900000),
            channelId,
            recipient,
            author,
            actualName,
            trip,
            timestamp: new Date().toLocaleTimeString(),
            content: currentMsg,
            file: attachedFile,
            isSystem: false,
            replyTo: replyingTo,
            reactions: {}

          setIsMicMuted(false);

        const nextMuted = !isMicMuted;
        setIsMicMuted(nextMuted);
        setIsSpeakingLocal(!nextMuted);

      const handleToggleSpeaking = () => {
        if (isMicMuted) return;
        const nextSpeaking = !isSpeakingLocal;

          socketRef.current.emit('updateVoiceState', {

      const handleTerminalSubmit = (e) => {

        return text.split('\n').map((line, idx) => {
          if (line.startsWith('>')) {

          return <div key={idx}>{line}</div>;

      const formatTime = (seconds) => {
        const m = Math.floor(seconds / 60).toString().padStart(2, '0');
        const s = (seconds % 60).toString().padStart(2, '0');
        return `${m}:${s}`;

        if (activeChatTarget.type === 'channel') {

          return post.channelId === activeChatTarget.id || (!post.channelId && !post.recipient && activeChatTarget.id === '#main-board');

          const dmTarget = activeChatTarget.id;

                            (post.recipient === currentUser?.username && post.author === dmTarget) ||

            {/* Quick Action Buttons */}

              <button

              {/* Moderation / Approvals (For Master Admin) */}
              {currentUser.isAdmin && (

              {/* Voice Call Button */}

                <div className="flex items-center gap-2">

                    value={terminalInput}
                    onChange={(e) => setTerminalInput(e.target.value)}
                    placeholder="Enter tactical command (/hack, /defend, /scan, /status)..."
                    className="flex-1 bg-transparent text-gray-200 focus:outline-none placeholder-gray-600"
                  />
                  <button type="submit" className="px-3.5 py-1 bg-emerald-600 text-black font-bold rounded hover:bg-emerald-500 text-xs">
                    Execute
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* IMAGE LIGHTBOX */}
          {lightboxImg && (
            <div className="fixed inset-0 bg-black/95 z-50 flex items-center justify-center p-4 cursor-pointer" onClick={() => setLightboxImg(null)}>
              <img src={lightboxImg} alt="Payload preview" className="max-w-full max-h-[90vh] object-contain rounded shadow-2xl border border-gray-800" />
            </div>
          )}

          {/* FOOTER */}
          <footer className="mt-2 text-center text-[11px] text-gray-600 font-mono">
            REPLICA PRIVATE CYBERBOARD &bull; OWNER: {MASTER_ADMIN_EMAIL} &bull; SHIELDED BY JARVIS AI SENTINEL &bull; NO LOGS PERSISTED
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ReplicaApp />);
  </script>
</body>
</html>
