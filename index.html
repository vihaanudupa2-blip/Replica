    // Absolute & Relative Timestamp Helpers
    const formatAbsoluteTime = (dateInput, fallbackString) => {
      let d = dateInput ? new Date(dateInput) : null;
      if (!d || isNaN(d.getTime())) {
        return fallbackString || 'Oct 9, 08:00';
      }
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      const month = months[d.getMonth()];
      const day = d.getDate();
      const hours = d.getHours().toString().padStart(2, '0');
      const minutes = d.getMinutes().toString().padStart(2, '0');
      return `${month} ${day}, ${hours}:${minutes}`;
    };

    const formatRelativeTime = (dateInput, fallbackString) => {
      if (!dateInput) return fallbackString || 'just now';
      let d = new Date(dateInput);
      if (isNaN(d.getTime())) return fallbackString || 'just now';
      const now = new Date();
      const diffSec = Math.max(0, Math.floor((now - d) / 1000));
      if (diffSec < 45) return 'just now';
      const diffMin = Math.floor(diffSec / 60);
      if (diffMin < 60) return `${diffMin}m ago`;
      const diffHours = Math.floor(diffMin / 60);
      if (diffHours < 24) return `${diffHours}h ago`;
      const diffDays = Math.floor(diffHours / 24);
      if (diffDays < 7) return `${diffDays}d ago`;
      return formatAbsoluteTime(dateInput, fallbackString);
    };

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        const now = ctx.currentTime;

          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(660, now + 0.06);

          gain.gain.linearRampToValueAtTime(0.001, now + 0.06);

          osc.stop(now + 0.06);

    function ReplicaApp() {
      // User Identity & Gatekeeper State
      const [currentUser, setCurrentUser] = useState(() => {

      const [activeChatTarget, setActiveChatTarget] = useState({ type: 'channel', id: '#main-board' });

      // Core State
      const [posts, setPosts] = useState([]);

      const [chatSearchQuery, setChatSearchQuery] = useState('');
      const [activeUsersCount, setActiveUsersCount] = useState(1);
      const [copiedLink, setCopiedLink] = useState(false);
      const [lightboxImg, setLightboxImg] = useState(null);
      const [isTerminalOpen, setIsTerminalOpen] = useState(false);
      const [terminalInput, setTerminalInput] = useState('');
      const [showSlashHints, setShowSlashHints] = useState(false);
      const [hoveredPostId, setHoveredPostId] = useState(null);
      const [activeEmojiPickerPostId, setActiveEmojiPickerPostId] = useState(null);

      // Online & Offline Members State
      const [onlineUsers, setOnlineUsers] = useState([]);
      const [allMembers, setAllMembers] = useState([]);
      const [isMembersSidebarOpen, setIsMembersSidebarOpen] = useState(true);
      const [selectedMember, setSelectedMember] = useState(null);
      const [isNewDmModalOpen, setIsNewDmModalOpen] = useState(false);
      const [newDmSearch, setNewDmSearch] = useState('');

      // Browser Notification Permission State
      const [notificationPermission, setNotificationPermission] = useState(() => {
        if (typeof Notification !== 'undefined') {
          return Notification.permission;
        }
        return 'unsupported';
      });
      const [showNotifBanner, setShowNotifBanner] = useState(() => {
        return typeof Notification !== 'undefined' && Notification.permission === 'default';
      });

      // Track Last Read Timestamps for DMs and Unread Badges
      const [lastReadTimestamps, setLastReadTimestamps] = useState(() => {
        try {
          const saved = localStorage.getItem('replica_last_read');

      // Incoming Call & Add to Call State
      const [incomingCallInvite, setIncomingCallInvite] = useState(null);
      const [isInviteModalOpen, setIsInviteModalOpen] = useState(false);
      const [inviteFeedback, setInviteFeedback] = useState('');

      // Moderation State
      const [accessRequests, setAccessRequests] = useState([]);
      const [isRequestsModalOpen, setIsRequestsModalOpen] = useState(false);
      const [bannedUsersList, setBannedUsersList] = useState([]);
      const [adminModalTab, setAdminModalTab] = useState('approvals');

      // Security Sentinel State (Auto-Defense Active)
      const [securityState, setSecurityState] = useState({
        threatsNeutralized: 24,
        firewallIntegrity: 100,
        defenseMode: 'AUTONOMOUS ACTIVE',
        systemAuditLogs: [
          `[SYS] JARVIS AI Sentinel initialized.`,
          `[AUTO-DEFENSE] Continuous intrusion detection daemon engaged. Defense is 100% AUTOMATIC.`,
          `[GATE] Gatekeeper locked. Master Admin: ${MASTER_ADMIN_EMAIL}.`
        ]
      });

      // Voice Call State with Microphone Activity Tracking
      const [isVoiceActive, setIsVoiceActive] = useState(false);
      const [isMicMuted, setIsMicMuted] = useState(false);
      const [isSpeakingLocal, setIsSpeakingLocal] = useState(false);
      const [voiceParticipants, setVoiceParticipants] = useState([]);
      const [callDuration, setCallDuration] = useState(0);

      // File attachment state
      const [attachedFile, setAttachedFile] = useState(null);
      const [isScanningFile, setIsScanningFile] = useState(false);

      const socketRef = useRef(null);
      const chatEndRef = useRef(null);
      const messageInputRef = useRef(null);
      const fileInputRef = useRef(null);
      const callTimerRef = useRef(null);
      const micAudioCtxRef = useRef(null);
      const micStreamRef = useRef(null);

      // Connect to Socket.IO Server
      useEffect(() => {
        const socket = io({
          reconnection: true,
          reconnectionAttempts: 10,
          reconnectionDelay: 1000
        });
        socketRef.current = socket;

        socket.on('connect', () => {
          console.log('[Socket] Connected to REPLICA secure core');
          socket.emit('requestAllPosts');
          socket.emit('getSecurityState');
          socket.emit('getVoiceParticipants');

          // Identify user if logged in
          if (currentUser) {
            socket.emit('identifyUser', currentUser);
          }
        });

        socket.on('initialPosts', (initialPosts) => {
          if (Array.isArray(initialPosts)) {
            setPosts(initialPosts);
          }
        });

        socket.on('newPost', (newPost) => {
          setPosts((prev) => {
            if (prev.some(p => p.id === newPost.id)) return prev;
            return [...prev, newPost];
          });
          playCyberAudio(newPost.isSystem ? 'alert' : 'send');

          // Native Desktop Notification for incoming DM when tab is backgrounded or in another chat
          try {
            if (
              newPost.recipient &&
              currentUser &&
              newPost.recipient.toLowerCase() === currentUser.username.toLowerCase() &&
              newPost.author.toLowerCase() !== currentUser.username.toLowerCase()
            ) {
              if (document.hidden || activeChatTarget.id !== newPost.author) {
                if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
                  const notif = new Notification(`💬 DM from @${newPost.author}`, {
                    body: newPost.content ? (newPost.content.length > 80 ? newPost.content.substring(0, 77) + '...' : newPost.content) : 'Sent an attachment',
                    tag: `dm-${newPost.author}`
                  });
                  notif.onclick = () => {
                    window.focus();
                    setActiveChatTarget({ type: 'dm', id: newPost.author });
                    notif.close();
                  };
                }
              }
            }
          } catch (e) {}
        });

        socket.on('postReactionUpdate', ({ postId, reactions }) => {
          setPosts((prev) =>
            prev.map((p) => (p.id === postId ? { ...p, reactions } : p))
          );
          playCyberAudio('react');
        });

        socket.on('voiceStateUpdate', (participants) => {
          if (Array.isArray(participants)) {
            setVoiceParticipants(participants);
          }
        });

        socket.on('onlineUsersList', (users) => {
          if (Array.isArray(users)) {
            setOnlineUsers(users);
          }
        });

        socket.on('allMembersList', (members) => {
          if (Array.isArray(members)) {
            setAllMembers(members);
          }
        });

        // Real-Time Incoming Call Invitation with Browser Notification
        socket.on('incomingCallInvite', (invite) => {
          setIncomingCallInvite(invite);
          playCyberAudio('ring');

          if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
            try {
              const notif = new Notification(`📞 Incoming Call from @${invite.fromUsername}`, {
                body: `Voice call invitation for "${invite.roomName || 'Voice Room'}". Click to answer and join!`,
                tag: 'voice-call-' + invite.fromUsername,
                requireInteraction: true
              });
              notif.onclick = () => {
                window.focus();
                handleAcceptIncomingCall();
                notif.close();
              };
            } catch (e) {
              console.warn('Call notification error:', e);
            }
          }
        });

        socket.on('securityState', (sec) => {
          if (sec) setSecurityState(prev => ({ ...prev, ...sec }));
        });

        socket.on('securityAuditLog', (logEntry) => {
          setSecurityState((prev) => ({
            ...prev,
            systemAuditLogs: [...prev.systemAuditLogs.slice(-60), logEntry]
          }));
        });

        socket.on('userCount', (count) => {
          setActiveUsersCount(count || 1);
        });

        socket.on('allAccessRequests', (requests) => {
          if (Array.isArray(requests)) {
            setAccessRequests(requests);
          }
        });

        socket.on('bannedUsersList', (banned) => {
          if (Array.isArray(banned)) setBannedUsersList(banned);
        });

        socket.on('newAccessRequestNotification', () => {
          playCyberAudio('alert');
        });

        socket.on('adminPasswordResult', ({ success, adminUser, message }) => {
          if (success && adminUser) {
            setCurrentUser(adminUser);
            setIsAdminLoginModal(false);
            setAdminAuthError('');
            playCyberAudio('grant');
            socket.emit('identifyUser', adminUser);
          } else {
            setAdminAuthError(message || 'Incorrect master password');
            playCyberAudio('alert');
          }
        });

        socket.on('accessDecision', ({ requestId, username, status }) => {
          if (pendingRequestId === requestId || (currentUser && currentUser.username === username)) {
            if (status === 'approved') {
              setGatekeeperStatus('approved');
              const approvedObj = {
                username,
                actualName: inputActualName || username,
                isApproved: true,
                isAdmin: false
              };
              setCurrentUser(approvedObj);
              localStorage.setItem('replica_user', JSON.stringify(approvedObj));
              playCyberAudio('grant');
              socket.emit('identifyUser', approvedObj);
            } else if (status === 'denied') {
              setGatekeeperStatus('denied');
              playCyberAudio('alert');
            }
          }
        });

        // Real-time Ban Event
        socket.on('userBannedEvent', ({ username, reason }) => {
          if (currentUser && currentUser.username.toLowerCase() === username.toLowerCase()) {
            setBannedReason(reason);
            setGatekeeperStatus('banned');
            setCurrentUser(null);
            localStorage.removeItem('replica_user');
            if (isVoiceActive) handleToggleVoice();
            playCyberAudio('alert');
          }
        });

        socket.on('userRevoked', ({ username }) => {
          if (currentUser && currentUser.username.toLowerCase() === username.toLowerCase()) {
            setCurrentUser(null);
            localStorage.removeItem('replica_user');
            setGatekeeperStatus('idle');
          }
        });

        return () => {
          socket.disconnect();
        };
      }, [pendingRequestId, currentUser, isVoiceActive, inputActualName]);

      // Save user session & identify to server
      useEffect(() => {
        if (currentUser) {
          localStorage.setItem('replica_user', JSON.stringify(currentUser));
          if (socketRef.current) {
            socketRef.current.emit('identifyUser', currentUser);
          }
        }
      }, [currentUser]);

      // Scroll chat to bottom
      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [posts, activeChatTarget]);

      // Voice call duration timer
      useEffect(() => {
        if (isVoiceActive) {
          callTimerRef.current = setInterval(() => {
            setCallDuration(d => d + 1);
          }, 1000);
        } else {
          clearInterval(callTimerRef.current);
          setCallDuration(0);
        }
        return () => clearInterval(callTimerRef.current);
      }, [isVoiceActive]);

      // Periodic timer to keep relative timestamps fresh
      const [, setTimeTick] = useState(0);
      useEffect(() => {
        const interval = setInterval(() => setTimeTick(t => t + 1), 15000);
        return () => clearInterval(interval);
      }, []);

      // Real Mic Level Activity Detector
      useEffect(() => {
        if (!isVoiceActive || isMicMuted) {
          setIsSpeakingLocal(false);
          if (socketRef.current) {
            socketRef.current.emit('updateVoiceState', { speaking: false, isMuted: isMicMuted });
          }
          return;
        }

        let audioContext;
        let analyser;
        let microphone;
        let javascriptNode;

        async function initMicDetection() {
          try {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            micStreamRef.current = stream;
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            micAudioCtxRef.current = audioContext;
            analyser = audioContext.createAnalyser();
            microphone = audioContext.createMediaStreamSource(stream);
            javascriptNode = audioContext.createScriptProcessor(2048, 1, 1);

            analyser.smoothingTimeConstant = 0.5;
            analyser.fftSize = 512;

            microphone.connect(analyser);
            analyser.connect(javascriptNode);
            javascriptNode.connect(audioContext.destination);

            javascriptNode.onaudioprocess = () => {
              const array = new Uint8Array(analyser.frequencyBinCount);
              analyser.getByteFrequencyData(array);
              let values = 0;
              for (let i = 0; i < array.length; i++) values += array[i];
              const average = values / array.length;
              const isSpeakingNow = average > 14;

              setIsSpeakingLocal((prev) => {
                if (prev !== isSpeakingNow && socketRef.current) {
                  socketRef.current.emit('updateVoiceState', { speaking: isSpeakingNow, isMuted: false });
                }
                return isSpeakingNow;
              });
            };
          } catch (err) {
            console.log('Audio capture optional/mocked:', err.message);
          }
        }

        initMicDetection();

        return () => {
          if (javascriptNode) javascriptNode.disconnect();
          if (analyser) analyser.disconnect();
          if (microphone) microphone.disconnect();
          if (audioContext && audioContext.state !== 'closed') audioContext.close();
          if (micStreamRef.current) {
            micStreamRef.current.getTracks().forEach(t => t.stop());
          }
        };
      }, [isVoiceActive, isMicMuted]);

      // Copy Link
      const handleCopyInviteLink = () => {
        const url = window.location.origin + window.location.pathname;
        navigator.clipboard.writeText(url).then(() => {
          setCopiedLink(true);
          setTimeout(() => setCopiedLink(false), 2500);
        });

      // Request Access Form Submit
      const handleRequestAccessSubmit = (e) => {
        e.preventDefault();
        if (!inputActualName.trim() || !inputUsername.trim()) return;

        setGatekeeperStatus('pending');
        playCyberAudio('send');

        if (socketRef.current) {
          socketRef.current.emit('requestAccess', {
            actualName: inputActualName.trim(),
            username: inputUsername.trim(),
            note: inputNote.trim()
          });
        }
      };

      // Master Admin Password Form Submit (Password Only, No Gmail input!)
      const handleAdminPasswordSubmit = (e) => {
        e.preventDefault();
        if (!adminInputPassword.trim()) return;

        if (socketRef.current) {
          socketRef.current.emit('verifyAdminPassword', {
            password: adminInputPassword.trim()
          });

      // Resolve Access Request

        socketRef.current.emit('resolveAccessRequest', {
          requestId,
          action
        });
      };

      // Ban a user
      const handleBanUser = (targetUsername) => {
        if (!targetUsername) return;
        const reason = prompt(`Enter ban reason for @${targetUsername}:`, 'Violation of server rules');
        if (reason === null) return;
        if (socketRef.current) {
          socketRef.current.emit('banUser', { username: targetUsername, reason });
        }
      };

      // Unban a user
      const handleUnbanUser = (targetUsername) => {
        if (!targetUsername || !socketRef.current) return;
        socketRef.current.emit('unbanUser', { username: targetUsername });
      };

      // Toggle Emoji Reaction
      const handleToggleReaction = (postId, emoji) => {
        if (!currentUser || !socketRef.current) return;
        socketRef.current.emit('toggleReaction', {
          postId,

        });

      // Join/Leave Voice Call

        if (!isVoiceActive) {
          setIsVoiceActive(true);
          setIsMicMuted(false);
          setIsSpeakingLocal(false);
          playCyberAudio('grant');
          if (socketRef.current && currentUser) {
            socketRef.current.emit('joinVoiceCall', {
              username: currentUser.username,
              actualName: currentUser.actualName,

            });
          }
        } else {
          setIsVoiceActive(false);
          setIsSpeakingLocal(false);
          playCyberAudio('alert');
          if (socketRef.current) {
            socketRef.current.emit('leaveVoiceCall');
          }
        }
      };

      // Accept Incoming Call Invitation
      const handleAcceptIncomingCall = () => {
        setIncomingCallInvite(null);
        if (!isVoiceActive) {
          handleToggleVoice();
        }
      };

      // Invite a friend to voice call
      const handleInviteUserToCall = (targetUsername) => {
        if (!socketRef.current || !targetUsername) return;
        socketRef.current.emit('inviteToCall', {
          targetUsername,
          fromUsername: currentUser.username,
          roomId: 'general',

        });

        setTimeout(() => setInviteFeedback(''), 2500);

      // Toggle Mic Mute
      const handleToggleMicMute = () => {
        const nextMuted = !isMicMuted;
        setIsMicMuted(nextMuted);
        if (nextMuted) setIsSpeakingLocal(false);
        if (socketRef.current) {
          socketRef.current.emit('updateVoiceState', { isMuted: nextMuted, speaking: false });
        }
      };

      // Toggle Speaking Indicator (Manual test helper)
      const handleToggleSpeaking = () => {
        if (isMicMuted) return;
        const nextSpeaking = !isSpeakingLocal;
        setIsSpeakingLocal(nextSpeaking);
        if (socketRef.current) {
          socketRef.current.emit('updateVoiceState', { speaking: nextSpeaking, isMuted: false });
        }
      };

      // Handle File Upload
      const handleFileSelect = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        if (file.size > 8 * 1024 * 1024) {
          alert('File size exceeds 8MB server buffer limit.');
          return;
        }

        setIsScanningFile(true);
        const reader = new FileReader();
        reader.onload = (event) => {
          setTimeout(() => {
            setAttachedFile({
              name: file.name,
              size: (file.size / 1024).toFixed(1) + ' KB',
              type: file.type,
              isImage: file.type.startsWith('image/'),
              isAudio: file.type.startsWith('audio/'),
              dataUrl: event.target.result
            });
            setIsScanningFile(false);
            playCyberAudio('send');
          }, 300);
        };
        reader.readAsDataURL(file);
      };

      // Submit Chat Post
      const handlePostSubmit = (e) => {
        e.preventDefault();
        if (!message.trim() && !attachedFile) return;

        const author = currentUser ? currentUser.username : 'Anonymous';
        const actualName = currentUser ? currentUser.actualName : 'Unknown';
        const trip = currentUser && currentUser.isAdmin ? '!mAsTeR99' : '!uSer7x';

        const channelId = activeChatTarget.type === 'channel' ? activeChatTarget.id : null;
        const recipient = activeChatTarget.type === 'dm' ? activeChatTarget.id : null;

        const postData = {
          channelId,
          recipient,
          author,
          actualName,
          trip,
          timestamp: new Date().toLocaleTimeString(),
          createdAt: new Date().toISOString(),
          content: message,
          file: attachedFile,
          isSystem: false,
          replyTo: replyingTo,
          reactions: {}
        };

        if (socketRef.current) {
          socketRef.current.emit('sendPost', postData);
        }

        setMessage('');
        setAttachedFile(null);
        setReplyingTo(null);
        setShowSlashHints(false);
      };

      // Execute Terminal Command
      const handleTerminalSubmit = (e) => {
        e.preventDefault();
        if (!terminalInput.trim()) return;

        const cmd = terminalInput.trim();
        setTerminalInput('');

        const postData = {
          channelId: '#hack-ops',
          recipient: null,
          author: currentUser ? currentUser.username : 'Anonymous',
          actualName: currentUser ? currentUser.actualName : 'Unknown',
          trip: '[HACK_TERMINAL]',
          content: cmd,
          file: null,
          isSystem: false,
          replyTo: null,
          reactions: {}
        };

        if (socketRef.current) {
          socketRef.current.emit('sendPost', postData);
        }
      };

      // Format Greentext & Quotes
      const formatGreentext = (text) => {
        if (!text) return null;
        return text.split('\n').map((line, idx) => {
          if (line.startsWith('>>No.') || line.startsWith('>>')) {
            return <div key={idx} className="text-indigo-400 font-mono text-xs">{line}</div>;
          }
          if (line.startsWith('>')) {
            return <div key={idx} className="greentext font-mono">{line}</div>;
          }
          return <div key={idx}>{line}</div>;
        });
      };

      // Format Timer
      const formatTime = (secs) => {
        const m = Math.floor(secs / 60).toString().padStart(2, '0');
        const s = (secs % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      };

      // Filter posts for active chat target (channel or DM) and search keyword
      const channelOrDmPosts = posts.filter((post) => {
        if (activeChatTarget.type === 'channel') {
          return post.channelId === activeChatTarget.id;
        } else {
          const dmTarget = activeChatTarget.id;
          const isBetween = (post.recipient === dmTarget && post.author === currentUser?.username) ||
                            (post.recipient === currentUser?.username && post.author === dmTarget) ||
                            (dmTarget === 'JARVIS' && (post.author === 'JARVIS AI' && post.recipient === currentUser?.username));
          return isBetween;
        }
      });

      const filteredPosts = chatSearchQuery.trim() === ''
        ? channelOrDmPosts
        : channelOrDmPosts.filter((post) => {
            const q = chatSearchQuery.toLowerCase().trim();
            const contentMatch = post.content && post.content.toLowerCase().includes(q);
            const authorMatch = post.author && post.author.toLowerCase().includes(q);
            const actualNameMatch = post.actualName && post.actualName.toLowerCase().includes(q);
            const tripMatch = post.trip && post.trip.toLowerCase().includes(q);
            const fileMatch = post.file?.name && post.file.name.toLowerCase().includes(q);
            return contentMatch || authorMatch || actualNameMatch || tripMatch || fileMatch;
          });

      // Request Browser Notification Permission Helper
      const requestNotificationPermission = async () => {
        if (typeof Notification === 'undefined') {
          alert('Desktop notifications are not supported in this browser.');
          return;
        }
        try {
          const res = await Notification.requestPermission();
          setNotificationPermission(res);
          setShowNotifBanner(false);
          if (res === 'granted') {
            playCyberAudio('grant');
            try {
              new Notification('🔔 Call & Message Alerts Enabled!', {
                body: 'You will receive immediate alerts for incoming voice calls and private DMs.',
                tag: 'notification-welcome'
              });
            } catch (e) {}
          }
        } catch (e) {
          console.warn('Error requesting notification permission:', e);
        }
      };

      // Mark active chat as read whenever target or posts change
      useEffect(() => {
        if (activeChatTarget) {
          setLastReadTimestamps((prev) => {
            const updated = { ...prev, [activeChatTarget.id]: Date.now() };
            try {
              localStorage.setItem('replica_last_read', JSON.stringify(updated));
            } catch (e) {}
            return updated;
          });
        }

                              <div className="font-semibold text-slate-100 flex items-center gap-2">
                                {req.actualName}
                                <span className="text-slate-400 font-mono text-[11px]">(@{req.username})</span>
                              </div>
                              {req.note && (
                                <div className="text-slate-400 text-[11px] mt-0.5">"{req.note}"</div>
                              )}
                              <div className="text-[10px] text-slate-500 font-mono mt-0.5">ID: {req.id}</div>
                            </div>
                          </div>

                          <div className="flex items-center gap-2">
                            {req.status === 'pending' ? (
                              <>
                                <button
                                  onClick={() => handleResolveRequest(req.id, 'approve')}
                                  className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-medium rounded-lg text-xs transition"
                                >
                                  Approve
                                </button>
                                <button
                                  onClick={() => handleResolveRequest(req.id, 'deny')}
                                  className="px-3 py-1.5 bg-rose-900/60 hover:bg-rose-800 text-rose-200 font-medium rounded-lg text-xs transition"
                                >
                                  Deny
                                </button>
                              </>
                            ) : (
                              <span className={`px-2 py-0.5 rounded font-medium text-xs ${
                                req.status === 'approved' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-rose-950 text-rose-400 border border-rose-800'
                              }`}>
                                {req.status.toUpperCase()}
                              </span>
                            )}
                          </div>
                        </div>
                      ))
                    )
                  ) : (
                    bannedUsersList.length === 0 ? (
                      <div className="text-center py-10 text-slate-500 text-xs">
                        No banned accounts.
                      </div>
                    ) : (
                      bannedUsersList.map((ban) => (
                        <div key={ban.username} className="p-3 bg-slate-900 border border-slate-800 rounded-xl flex items-center justify-between gap-3 text-xs">
                          <div className="flex items-center gap-3">
                            <UserAvatar username={ban.username} size="sm" />
                            <div>
                              <div className="font-semibold text-rose-400 font-mono">@{ban.username}</div>
                              <div className="text-slate-400 text-[11px]">Reason: {ban.reason}</div>
                            </div>
                          </div>
                          <button
                            onClick={() => handleUnbanUser(ban.username)}
                            className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs transition"
                          >
                            Unban
                          </button>
                        </div>
                      ))
                    )
                  )}
                </div>
              </div>
            </div>
          )}

          {/* JARVIS TERMINAL / CONSOLE MODAL */}
          {isTerminalOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-3">
              <div className="bg-[#121620] border border-slate-800 rounded-2xl max-w-xl w-full shadow-2xl flex flex-col max-h-[85vh] overflow-hidden">
                <div className="bg-[#0f121a] border-b border-slate-800 px-4 py-2.5 flex items-center justify-between text-xs">
                  <div className="flex items-center gap-2 font-semibold text-slate-200">
                    <TerminalIcon /> JARVIS Tactical Console
                  </div>
                  <button onClick={() => setIsTerminalOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <div className="p-4 bg-[#0d1017] text-slate-300 font-mono text-xs overflow-y-auto space-y-2 flex-1 max-h-72 custom-scrollbar">
                  {securityState.systemAuditLogs.map((log, i) => (
                    <div key={i} className="leading-relaxed">{log}</div>
                  ))}
                </div>

                <form onSubmit={handleTerminalSubmit} className="p-3 bg-[#121620] border-t border-slate-800 flex items-center gap-2">
                  <span className="text-indigo-400 font-mono font-bold text-xs">&gt;</span>
                  <input
                    type="text"
                    value={terminalInput}
                    onChange={(e) => setTerminalInput(e.target.value)}
                    placeholder="Enter command (e.g. /hack, /defend, /scan, /status)..."
                    className="flex-1 bg-slate-900 border border-slate-700/80 rounded-lg px-2.5 py-1.5 text-xs text-slate-100 font-mono focus:outline-none focus:border-indigo-500"
                  />
                  <button type="submit" className="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold">
                    Execute
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* LIGHTBOX FOR IMAGES */}
          {lightboxImg && (
            <div className="fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4" onClick={() => setLightboxImg(null)}>
              <img src={lightboxImg} alt="Preview" className="max-w-full max-h-[90vh] object-contain rounded-xl shadow-2xl" />
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ReplicaApp />);
  </script>
</body>
</html>
