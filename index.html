    // Absolute & Relative Timestamp Helpers
    const formatAbsoluteTime = (dateInput, fallbackString) => {
      let d = dateInput ? new Date(dateInput) : null;
      if (!d || isNaN(d.getTime())) {
        return fallbackString || 'Oct 9, 08:00';
      }
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      const month = months[d.getMonth()];
      const day = d.getDate();
      const hours = d.getHours().toString().padStart(2, '0');
      const minutes = d.getMinutes().toString().padStart(2, '0');
      return `${month} ${day}, ${hours}:${minutes}`;
    };

    const formatRelativeTime = (dateInput, fallbackString) => {
      if (!dateInput) return fallbackString || 'just now';
      let d = new Date(dateInput);
      if (isNaN(d.getTime())) return fallbackString || 'just now';
      const now = new Date();
      const diffSec = Math.max(0, Math.floor((now - d) / 1000));
      if (diffSec < 45) return 'just now';
      const diffMin = Math.floor(diffSec / 60);
      if (diffMin < 60) return `${diffMin}m ago`;
      const diffHours = Math.floor(diffMin / 60);
      if (diffHours < 24) return `${diffHours}h ago`;
      const diffDays = Math.floor(diffHours / 24);

      return formatAbsoluteTime(dateInput, fallbackString);

          if (!data) return '';
          try {
            const base64 = data.replace(/-/g, '+').replace(/_/g, '/');

                </button>
              </div>
            </div>
          )}

          {/* NEW DIRECT MESSAGE MODAL (TEXT ANY ONLINE OR OFFLINE MEMBER) */}
          {isNewDmModalOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-3" onClick={() => setIsNewDmModalOpen(false)}>
              <div className="bg-[#161b26] border border-slate-800 rounded-2xl max-w-sm w-full p-5 shadow-2xl space-y-4" onClick={(e) => e.stopPropagation()}>
                <div className="flex items-center justify-between">
                  <h3 className="font-bold text-slate-100 text-sm flex items-center gap-2">
                    <MessageCircleIcon /> Start Direct Message (DM)
                  </h3>
                  <button onClick={() => setIsNewDmModalOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <p className="text-xs text-slate-400">
                  Text anyone on the server. If they are offline, your messages are saved and they will see them when they log in:
                </p>

                {/* Search / Type Username input */}
                <div className="relative">
                  <span className="absolute left-3 top-2.5 text-slate-500"><SearchIcon /></span>
                  <input
                    type="text"
                    autoFocus
                    value={newDmSearch}
                    onChange={(e) => setNewDmSearch(e.target.value)}
                    placeholder="Search member or enter username..."
                    className="w-full bg-slate-900 border border-slate-700/80 rounded-xl pl-9 pr-3 py-2 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500"
                  />
                </div>

                <div className="space-y-1.5 max-h-60 overflow-y-auto custom-scrollbar">
                  {/* Option to message entered custom username if not in list */}
                  {newDmSearch.trim() && !allKnownFriends.some(f => f.toLowerCase() === newDmSearch.trim().toLowerCase()) && (
                    <div
                      onClick={() => {
                        const target = newDmSearch.trim();
                        setActiveChatTarget({ type: 'dm', id: target });
                        setIsNewDmModalOpen(false);
                      }}
                      className="p-2.5 rounded-xl bg-indigo-950/60 border border-indigo-700/60 hover:bg-indigo-900/60 cursor-pointer flex items-center justify-between text-xs transition"
                    >
                      <div className="flex items-center gap-2 truncate">
                        <UserAvatar username={newDmSearch.trim()} size="sm" />
                        <div>
                          <div className="font-semibold text-white">Message @{newDmSearch.trim()}</div>
                          <div className="text-[10px] text-indigo-300">New offline direct message thread</div>
                        </div>
                      </div>
                      <span className="text-[11px] text-indigo-400 font-semibold">&rarr;</span>
                    </div>
                  )}

                  {/* List of members matching search */}
                  {allKnownFriends
                    .filter(f => f.toLowerCase().includes(newDmSearch.toLowerCase()))
                    .map(fName => {
                      const isOnline = onlineUsernamesSet.has(fName.toLowerCase());
                      const unread = getUnreadCountForTarget(fName);
                      return (
                        <div
                          key={fName}
                          onClick={() => {
                            setActiveChatTarget({ type: 'dm', id: fName });
                            setIsNewDmModalOpen(false);
                          }}
                          className="p-2 rounded-xl bg-slate-900/80 hover:bg-slate-800 border border-slate-800/80 cursor-pointer flex items-center justify-between text-xs transition"
                        >
                          <div className="flex items-center gap-2.5 truncate">
                            <UserAvatar username={fName} size="sm" showOnlineStatus={isOnline} />
                            <div className="truncate">
                              <div className="font-semibold text-slate-200">@{fName}</div>
                              <div className="text-[10px] text-slate-400 flex items-center gap-1.5">
                                <span className={`w-1.5 h-1.5 rounded-full ${isOnline ? 'bg-emerald-400' : 'bg-slate-500'}`}></span>
                                <span>{isOnline ? 'Online now' : 'Offline • Delivers on login'}</span>
                              </div>
                            </div>
                          </div>

                          <div className="flex items-center gap-2">
                            {unread > 0 && (
                              <span className="px-1.5 py-0.5 rounded-full bg-rose-600 text-white text-[10px] font-bold">
                                {unread}
                              </span>
                            )}
                            <button className="px-2.5 py-1 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-[11px] font-medium transition">
                              Chat
                            </button>
                          </div>
                        </div>
                      );
                    })}
                </div>

                <div className="pt-2 border-t border-slate-800 flex justify-end">
                  <button
                    onClick={() => setIsNewDmModalOpen(false)}
                    className="px-3.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs"
                  >
                    Cancel
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MASTER ADMIN DASHBOARD MODAL */}
          {isRequestsModalOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-3">
              <div className="bg-[#161b26] border border-slate-800 rounded-2xl max-w-2xl w-full shadow-2xl flex flex-col max-h-[85vh] overflow-hidden">
                <div className="bg-[#121620] border-b border-slate-800 px-4 py-3 flex items-center justify-between text-xs">
                  <div className="flex items-center gap-3">
                    <button
                      onClick={() => setAdminModalTab('approvals')}
                      className={`font-semibold pb-0.5 border-b-2 text-xs flex items-center gap-1.5 ${
                        adminModalTab === 'approvals' ? 'border-indigo-500 text-white' : 'border-transparent text-slate-400 hover:text-slate-200'
                      }`}
                    >
                      <UserCheckIcon /> Access Approvals ({pendingCount})
                    </button>
                    <button
                      onClick={() => setAdminModalTab('banned')}
                      className={`font-semibold pb-0.5 border-b-2 text-xs flex items-center gap-1.5 ${
                        adminModalTab === 'banned' ? 'border-indigo-500 text-white' : 'border-transparent text-slate-400 hover:text-slate-200'
                      }`}
                    >
                      <BanIcon /> Banned Accounts ({bannedUsersList.length})
                    </button>
                  </div>
                  <button onClick={() => setIsRequestsModalOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <div className="p-4 overflow-y-auto space-y-3 flex-1 custom-scrollbar">
                  {adminModalTab === 'approvals' ? (
                    accessRequests.length === 0 ? (
                      <div className="text-center py-10 text-slate-500 text-xs">
                        No access requests received yet.
                      </div>
                    ) : (
                      accessRequests.map((req) => (
                        <div key={req.id} className="p-3 bg-slate-900 border border-slate-800 rounded-xl flex flex-wrap items-center justify-between gap-3 text-xs">
                          <div className="flex items-center gap-3">
                            <UserAvatar username={req.username} size="md" />
                            <div>
                              <div className="font-semibold text-slate-100 flex items-center gap-2">
                                {req.actualName}
                                <span className="text-slate-400 font-mono text-[11px]">(@{req.username})</span>
                              </div>
                              {req.note && (
                                <div className="text-slate-400 text-[11px] mt-0.5">"{req.note}"</div>
                              )}
                              <div className="text-[10px] text-slate-500 font-mono mt-0.5">ID: {req.id}</div>
                            </div>
                          </div>

                          <div className="flex items-center gap-2">
                            {req.status === 'pending' ? (
                              <>
                                <button
                                  onClick={() => handleResolveRequest(req.id, 'approve')}
                                  className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-medium rounded-lg text-xs transition"
                                >
                                  Approve
                                </button>
                                <button
                                  onClick={() => handleResolveRequest(req.id, 'deny')}
                                  className="px-3 py-1.5 bg-rose-900/60 hover:bg-rose-800 text-rose-200 font-medium rounded-lg text-xs transition"
                                >
                                  Deny
                                </button>
                              </>
                            ) : (
                              <span className={`px-2 py-0.5 rounded font-medium text-xs ${
                                req.status === 'approved' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-rose-950 text-rose-400 border border-rose-800'
                              }`}>
                                {req.status.toUpperCase()}
                              </span>
                            )}
                          </div>
                        </div>
                      ))
                    )
                  ) : (
                    bannedUsersList.length === 0 ? (
                      <div className="text-center py-10 text-slate-500 text-xs">
                        No banned accounts.
                      </div>
                    ) : (
                      bannedUsersList.map((ban) => (
                        <div key={ban.username} className="p-3 bg-slate-900 border border-slate-800 rounded-xl flex items-center justify-between gap-3 text-xs">
                          <div className="flex items-center gap-3">
                            <UserAvatar username={ban.username} size="sm" />
                            <div>
                              <div className="font-semibold text-rose-400 font-mono">@{ban.username}</div>
                              <div className="text-slate-400 text-[11px]">Reason: {ban.reason}</div>
                            </div>
                          </div>
                          <button
                            onClick={() => handleUnbanUser(ban.username)}
                            className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs transition"
                          >
                            Unban
                          </button>
                        </div>
                      ))
                    )
                  )}
                </div>
              </div>
            </div>
          )}

          {/* JARVIS TERMINAL / CONSOLE MODAL */}
          {isTerminalOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-3">
              <div className="bg-[#121620] border border-slate-800 rounded-2xl max-w-xl w-full shadow-2xl flex flex-col max-h-[85vh] overflow-hidden">
                <div className="bg-[#0f121a] border-b border-slate-800 px-4 py-2.5 flex items-center justify-between text-xs">
                  <div className="flex items-center gap-2 font-semibold text-slate-200">
                    <TerminalIcon /> JARVIS Tactical Console
                  </div>
                  <button onClick={() => setIsTerminalOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <div className="p-4 bg-[#0d1017] text-slate-300 font-mono text-xs overflow-y-auto space-y-2 flex-1 max-h-72 custom-scrollbar">
                  {securityState.systemAuditLogs.map((log, i) => (
                    <div key={i} className="leading-relaxed">{log}</div>
                  ))}
                </div>

                <form onSubmit={handleTerminalSubmit} className="p-3 bg-[#121620] border-t border-slate-800 flex items-center gap-2">
                  <span className="text-indigo-400 font-mono font-bold text-xs">&gt;</span>
                  <input
                    type="text"
                    value={terminalInput}
                    onChange={(e) => setTerminalInput(e.target.value)}
                    placeholder="Enter command (e.g. /hack, /defend, /scan, /status)..."
                    className="flex-1 bg-slate-900 border border-slate-700/80 rounded-lg px-2.5 py-1.5 text-xs text-slate-100 font-mono focus:outline-none focus:border-indigo-500"
                  />
                  <button type="submit" className="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold">
                    Execute
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* GMAIL COMPOSE MODAL */}
          {isComposeOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-3">
              <div className="bg-[#121620] border border-slate-700 rounded-2xl max-w-lg w-full p-5 shadow-2xl text-xs space-y-4">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <div className="flex items-center gap-2 text-white font-bold text-sm">
                    <EditIcon />
                    <span>New Gmail Transmission</span>
                  </div>
                  <button onClick={() => setIsComposeOpen(false)} className="text-slate-400 hover:text-white p-1">✕</button>
                </div>
                <form onSubmit={handleRequestSendEmail} className="space-y-3">
                  <div>
                    <label className="block text-[11px] text-slate-400 mb-1 font-medium">To (Recipient):</label>
                    <input
                      type="email"
                      required
                      value={composeForm.to}
                      onChange={(e) => setComposeForm({ ...composeForm, to: e.target.value })}
                      placeholder="e.g. colleague@example.com"
                      className="w-full bg-[#161b26] border border-slate-700 rounded-lg px-3 py-1.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-rose-500"
                    />
                  </div>
                  <div>
                    <label className="block text-[11px] text-slate-400 mb-1 font-medium">Subject:</label>
                    <input
                      type="text"
                      required
                      value={composeForm.subject}
                      onChange={(e) => setComposeForm({ ...composeForm, subject: e.target.value })}
                      placeholder="Subject of transmission"
                      className="w-full bg-[#161b26] border border-slate-700 rounded-lg px-3 py-1.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-rose-500"
                    />
                  </div>
                  <div>
                    <label className="block text-[11px] text-slate-400 mb-1 font-medium">Body:</label>
                    <textarea
                      rows="6"
                      required
                      value={composeForm.body}
                      onChange={(e) => setComposeForm({ ...composeForm, body: e.target.value })}
                      placeholder="Write your email here..."
                      className="w-full bg-[#161b26] border border-slate-700 rounded-lg px-3 py-2 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-rose-500 resize-none font-sans"
                    ></textarea>
                  </div>
                  <div className="flex items-center justify-end gap-2 pt-2 border-t border-slate-800">
                    <button
                      type="button"
                      onClick={() => setIsComposeOpen(false)}
                      className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg transition"
                    >
                      Discard
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-1.5 bg-rose-600 hover:bg-rose-500 text-white font-medium rounded-lg transition shadow-sm flex items-center gap-1.5"
                    >
                      <SendIcon />
                      <span>Review &amp; Send</span>
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MANDATORY USER CONFIRMATION DIALOG: SEND EMAIL */}
          {confirmSendModal.open && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-3">
              <div className="bg-[#121620] border border-rose-500/50 rounded-2xl max-w-md w-full p-5 shadow-2xl text-xs space-y-4">
                <div className="flex items-center gap-2 text-rose-400 font-bold text-sm">
                  <MailIcon />
                  <span>Send Email Confirmation</span>
                </div>
                <p className="text-slate-300 leading-relaxed">
                  Please confirm that you want to send this email message from your connected Google Account:
                </p>
                <div className="bg-[#161b26] border border-slate-800 rounded-xl p-3 space-y-1.5 text-slate-200">
                  <div><strong className="text-slate-400">Recipient:</strong> {confirmSendModal.to}</div>
                  <div><strong className="text-slate-400">Subject:</strong> {confirmSendModal.subject}</div>
                  <div className="text-[11px] text-slate-400 line-clamp-3 pt-1 border-t border-slate-800/80">
                    <strong>Message Preview:</strong> {confirmSendModal.body || '(No message body)'}
                  </div>
                </div>
                <div className="flex items-center justify-end gap-2 pt-2 border-t border-slate-800">
                  <button
                    onClick={() => setConfirmSendModal({ open: false, to: '', subject: '', body: '' })}
                    className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg transition"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={handleExecuteSendEmail}
                    disabled={composeSending}
                    className="px-4 py-1.5 bg-rose-600 hover:bg-rose-500 text-white font-semibold rounded-lg transition shadow-sm"
                  >
                    {composeSending ? 'Sending Transmission...' : 'Confirm & Send Email'}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MANDATORY USER CONFIRMATION DIALOG: DELETE / TRASH EMAIL */}
          {confirmDeleteModal.open && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-3">
              <div className="bg-[#121620] border border-rose-500/50 rounded-2xl max-w-md w-full p-5 shadow-2xl text-xs space-y-4">
                <div className="flex items-center gap-2 text-rose-400 font-bold text-sm">
                  <TrashIcon />
                  <span>Move Email to Trash</span>
                </div>
                <p className="text-slate-300 leading-relaxed">
                  Are you sure you want to move the message <strong>"{confirmDeleteModal.subject}"</strong> to the Trash folder? This will remove it from your active inbox view.
                </p>
                <div className="flex items-center justify-end gap-2 pt-2 border-t border-slate-800">
                  <button
                    onClick={() => setConfirmDeleteModal({ open: false, messageId: '', subject: '' })}
                    className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg transition"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={handleExecuteDeleteEmail}
                    className="px-4 py-1.5 bg-rose-600 hover:bg-rose-500 text-white font-semibold rounded-lg transition shadow-sm"
                  >
                    Confirm Delete
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* LIGHTBOX FOR IMAGES */}
          {lightboxImg && (
            <div className="fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4" onClick={() => setLightboxImg(null)}>
              <img src={lightboxImg} alt="Preview" className="max-w-full max-h-[90vh] object-contain rounded-xl shadow-2xl" />
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ReplicaApp />);
  </script>
</body>
</html>
